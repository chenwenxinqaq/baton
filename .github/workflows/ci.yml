name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Give the tests a Git identity
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      - name: Run the Python tests
        run: python -B -m unittest discover -s tests

  desktop:
    name: Desktop updater tests
    # The updater tests drive macOS tools such as ditto and codesign.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the updater tests
        working-directory: desktop
        run: node --test updater.test.cjs
