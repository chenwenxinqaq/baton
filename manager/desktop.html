<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>$heading · Unified Memory</title>
  <link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script>
</head>
<body class="desk $page_class">
  <aside class="rail">
    <a href="/?library=$library_key" class="identity">
      <span class="reicon" aria-hidden="true"><svg class="mark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16l9 5 9-5M3 11.5l9 5 9-5M12 3L3 8l9 5 9-5z"/></svg></span>
      <b>Unified Memory</b>
    </a>
    <form role="search" class="rail-search" action="/" method="get">$search_hidden_fields
      <input id="filter-q" name="q" type="search" value="$q" placeholder="搜索$list_title_short" aria-label="搜索$list_title_short">
    </form>
    <button type="button" class="rail-cmdk" data-cmdk-trigger aria-label="打开快速跳转面板">
      <span class="rail-cmdk-label">
        <span class="reicon" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>
        <span>快速跳转</span>
      </span>
      <kbd>⌘K</kbd>
    </button>
    <nav class="routes" aria-label="工作区">$desktop_nav</nav>
    <div class="rail-bottom">
      <div><span class="online-dot"></span>$library $library_nav</div>
      <div class="rail-version" id="rail-version" hidden></div>
    </div>
  </aside>
  <main class="paper">
    <header class="desk-top"><span>工作空间 <b>/</b> $section_name</span><div>$topbar_cta</div></header>
    <section class="update-banner" id="app-update-banner" hidden aria-live="polite"></section>
    <article class="sheet">$feedback $unreadable
      <div class="sheet-head">$detail_badges<h1 id="detail-title" tabindex="-1">$heading</h1>$detail_submeta
      <div class="sheet-actions">$detail_toolbar</div></div>
      $reader $editor $confirm_dialog
    </article>
  </main>
  <aside class="sync-notices" id="sync-notices" aria-label="同步状态" aria-live="polite"></aside>
</body></html>
